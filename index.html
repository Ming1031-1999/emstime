<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>救護秘錄器時間自動校正與換算器</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --accent: #0284c7;
            --input-bg: #ffffff;
            --table-header-bg: #f8fafc;
            --locked-bg: #f1f5f9;
        }

        /* 夜間模式色彩定義 */
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #38bdf8;
            --input-bg: #0f172a;
            --table-header-bg: #0f172a;
            --locked-bg: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
        }

        .desc {
            font-size: 0.85rem;
            color: #64748b;
            margin: 6px 0 16px 0;
        }

        [data-theme="dark"] .desc {
            color: #94a3b8;
        }

        .crew-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .crew-row {
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.2fr 1.2fr auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .crew-row.is-locked {
            background-color: var(--locked-bg);
        }

        @media (max-width: 680px) {
            .crew-row {
                grid-template-columns: 1fr 1fr;
            }
            .crew-row .action-col {
                grid-column: span 2;
                display: flex;
                justify-content: flex-end;
            }
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
            opacity: 0.8;
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text);
        }

        input:disabled {
            opacity: 0.9;
            cursor: not-allowed;
            font-weight: bold;
            color: var(--accent);
        }

        input:focus, select:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .badge-base { background: #dbeafe; color: #1e40af; }
        .badge-ahead { background: #dcfce7; color: #166534; }
        .badge-behind { background: #fee2e2; color: #991b1b; }

        [data-theme="dark"] .badge-base { background: #1e3a8a; color: #93c5fd; }
        [data-theme="dark"] .badge-ahead { background: #14532d; color: #86efac; }
        [data-theme="dark"] .badge-behind { background: #7f1d1d; color: #fca5a5; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .btn-theme {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-lock {
            padding: 8px 12px;
            font-size: 0.85rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-lock.locked {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-lock.unlocked {
            background: #0284c7;
            color: white;
        }

        [data-theme="dark"] .btn-lock.locked {
            background: #334155;
            color: #cbd5e1;
        }

        .btn-add { background: var(--primary); color: white; padding: 8px 14px; font-size: 0.85rem; }
        .btn-add:hover { opacity: 0.9; }

        .btn-del { background: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-del:hover { background: #dc2626; }

        .btn-base {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .tip-box {
            background-color: rgba(2, 132, 199, 0.08);
            border-left: 4px solid var(--accent);
            padding: 10px 14px;
            font-size: 0.85rem;
            border-radius: 0 6px 6px 0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-bar">
            <h1>救護秘錄器時間自動同步器</h1>
            <button id="theme-btn" class="btn-theme" onclick="cycleTheme()">🌐 自動</button>
        </div>
        <p class="desc">強制 24 小時制（HH:MM:SS）。解鎖欄位設定基準時差，上鎖欄位將自動即時換算。</p>

        <div class="tip-box">
            💡 <strong>操作說明：</strong><br>
            1. 先將所有人設為 <strong>🔓 未上鎖</strong>，輸入同一瞬間（如：接觸患者）的時間進行對齊校正。<br>
            2. 校正完成後，將不需要手動輸入的人員點擊 <strong>🔒 上鎖</strong>。<br>
            3. 之後只要在任何一個未上鎖的欄位輸入時間（24小時制，如 19:31:18），所有上鎖欄位就會<strong>自動換算為對應畫面時間</strong>！
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-weight: 600; font-size: 1rem; color: var(--primary);">出勤救護人員列表</span>
            <button class="btn-add" onclick="addCrew()">+ 新增人員</button>
        </div>

        <div id="crew-container" class="crew-list"></div>
    </div>
</div>

<script>
    // 預設救護人員資料 (anchorTime 紀錄對齊時的基準時間)
    let crewList = [
        { id: 'c1', name: '弘毅', time: '19:31:18', anchorTime: '19:31:18', isLocked: false, isBase: true },
        { id: 'c2', name: '焜弘', time: '19:32:40', anchorTime: '19:32:40', isLocked: true, isBase: false },
        { id: 'c3', name: '盈羽', time: '19:27:48', anchorTime: '19:27:48', isLocked: true, isBase: false },
        { id: 'c4', name: '忠和', time: '19:28:30', anchorTime: '19:28:30', isLocked: true, isBase: false }
    ];

    let themeSetting = 'auto';

    function cycleTheme() {
        if (themeSetting === 'auto') themeSetting = 'light';
        else if (themeSetting === 'light') themeSetting = 'dark';
        else themeSetting = 'auto';
        applyTheme();
    }

    function getEffectiveTheme() {
        if (themeSetting === 'auto') {
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        return themeSetting;
    }

    function applyTheme() {
        const effective = getEffectiveTheme();
        document.documentElement.setAttribute('data-theme', effective);
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) {
            if (themeSetting === 'auto') {
                themeBtn.innerHTML = `🌐 自動 (${effective === 'dark' ? '夜間' : '日間'})`;
            } else if (themeSetting === 'light') {
                themeBtn.innerHTML = '☀️ 日間模式';
            } else {
                themeBtn.innerHTML = '🌙 夜間模式';
            }
        }
    }

    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (themeSetting === 'auto') applyTheme();
        });
    }

    // 時間字串 (HH:MM:SS) 轉總秒數
    function timeToSeconds(t) { 
        if (!t || typeof t !== 'string') return 0; 
        const parts = t.split(':').map(Number); 
        if (parts.length < 2 || parts.some(isNaN)) return 0;
        return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0); 
    }

    // 總秒數轉時間字串 (HH:MM:SS 24小時制)
    function secondsToTime(s) { 
        s = (s % 86400 + 86400) % 86400; 
        const h = String(Math.floor(s / 3600)).padStart(2, '0');
        const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        const sec = String(Math.floor(s % 60)).padStart(2, '0');
        return `${h}:${m}:${sec}`; 
    }

    // 新增人員
    function addCrew() {
        const name = prompt("請輸入新增人員姓名或職務：", `隊員 ${crewList.length + 1}`);
        if (name === null) return;
        
        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const defaultTime = baseCam ? baseCam.time : '19:30:00';

        crewList.push({
            id: 'c_' + Date.now(),
            name: name.trim() || `隊員 ${crewList.length + 1}`,
            time: defaultTime,
            anchorTime: defaultTime,
            isLocked: false,
            isBase: false
        });
        render();
    }

    // 刪除人員
    function removeCrew(id) {
        if (crewList.length <= 1) return alert("至少需保留一位人員！");
        crewList = crewList.filter(c => c.id !== id);
        if (!crewList.some(c => c.isBase)) crewList[0].isBase = true;
        render();
    }

    // 設定基準人
    function setBaseCrew(id) {
        crewList.forEach(c => c.isBase = (c.id === id));
        render();
    }

    // 上鎖/解鎖開關
    function toggleLock(id) {
        const target = crewList.find(c => c.id === id);
        if (target) {
            target.isLocked = !target.isLocked;
            render();
        }
    }

    // 當使用者在「未上鎖」欄位輸入時間時觸發
    function handleTimeInput(sourceId, newTime) {
        if (!newTime) return;
        const source = crewList.find(c => c.id === sourceId);
        if (!source) return;

        source.time = newTime;

        if (!source.isLocked) {
            source.anchorTime = newTime;
        }

        const sourceAnchorSec = timeToSeconds(source.anchorTime);
        const sourceCurrentSec = timeToSeconds(source.time);

        crewList.forEach(target => {
            if (target.isLocked && target.id !== sourceId) {
                const targetAnchorSec = timeToSeconds(target.anchorTime);
                const targetNewSec = sourceCurrentSec + (targetAnchorSec - sourceAnchorSec);
                target.time = secondsToTime(targetNewSec);
                
                const inputEl = document.getElementById(`time-input-${target.id}`);
                if (inputEl) {
                    inputEl.value = target.time;
                }
            }
        });

        updateBadges();
    }

    // 更新名稱
    function updateCrewName(id, newName) {
        const c = crewList.find(item => item.id === id);
        if (c) c.name = newName;
    }

    // 即時更新時差標籤
    function updateBadges() {
        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const baseAnchorSec = timeToSeconds(baseCam.anchorTime);

        crewList.forEach(c => {
            const badgeEl = document.getElementById(`badge-${c.id}`);
            if (badgeEl) {
                const cAnchorSec = timeToSeconds(c.anchorTime);
                const diff = cAnchorSec - baseAnchorSec;

                let badgeHtml = '';
                if (c.isBase) {
                    badgeHtml = `<span class="badge badge-base">基準機</span>`;
                } else if (diff > 0) {
                    badgeHtml = `<span class="badge badge-ahead">快 ${diff} 秒</span>`;
                } else if (diff < 0) {
                    badgeHtml = `<span class="badge badge-behind">慢 ${Math.abs(diff)} 秒</span>`;
                } else {
                    badgeHtml = `<span class="badge badge-base">同步 (0s)</span>`;
                }
                badgeEl.innerHTML = badgeHtml;
            }
        });
    }

    // 渲染 UI
    function render() {
        const container = document.getElementById('crew-container');
        container.innerHTML = '';

        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const baseAnchorSec = timeToSeconds(baseCam.anchorTime);

        crewList.forEach(c => {
            const cAnchorSec = timeToSeconds(c.anchorTime);
            const diff = cAnchorSec - baseAnchorSec;

            let badgeHtml = '';
            if (c.isBase) {
                badgeHtml = `<span class="badge badge-base">基準機</span>`;
            } else if (diff > 0) {
                badgeHtml = `<span class="badge badge-ahead">快 ${diff} 秒</span>`;
            } else if (diff < 0) {
                badgeHtml = `<span class="badge badge-behind">慢 ${Math.abs(diff)} 秒</span>`;
            } else {
                badgeHtml = `<span class="badge badge-base">同步 (0s)</span>`;
            }

            const row = document.createElement('div');
            row.className = `crew-row ${c.isLocked ? 'is-locked' : ''}`;
            row.innerHTML = `
                <div>
                    <label>人員姓名 / 職務：</label>
                    <input type="text" value="${c.name}" oninput="updateCrewName('${c.id}', this.value)">
                </div>
                <div>
                    <label>秘錄器時間 (24小時制)：</label>
                    <input type="time" step="1" lang="en-GB" id="time-input-${c.id}" value="${c.time}" 
                        ${c.isLocked ? 'disabled' : ''} 
                        oninput="handleTimeInput('${c.id}', this.value)" 
                        onchange="handleTimeInput('${c.id}', this.value)">
                </div>
                <div>
                    <label>鎖定狀態：</label>
                    <button class="btn-lock ${c.isLocked ? 'locked' : 'unlocked'}" onclick="toggleLock('${c.id}')">
                        ${c.isLocked ? '🔒 已上鎖 (自動換算)' : '🔓 未上鎖 (編輯中)'}
                    </button>
                </div>
                <div>
                    <label>時差關係：</label>
                    <div id="badge-${c.id}">${badgeHtml}</div>
                </div>
                <div class="action-col" style="margin-top: 14px;">
                    ${!c.isBase ? `<button onclick="setBaseCrew('${c.id}')" class="btn-base">設為基準</button>` : ''}
                    ${!c.isBase ? `<button class="btn-del" onclick="removeCrew('${c.id}')" style="margin-left: 6px;">刪除</button>` : ''}
                </div>
            `;
            container.appendChild(row);
        });

        updateBadges();
    }

    window.onload = () => {
        applyTheme();
        render();
    };
</script>

</body>
</html>
