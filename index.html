<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>救護秘錄器時間自動校正與換算器</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --accent: #0284c7;
            --input-bg: #ffffff;
            --table-header-bg: #f8fafc;
            --locked-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #38bdf8;
            --input-bg: #0f172a;
            --table-header-bg: #0f172a;
            --locked-bg: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
        }

        .desc {
            font-size: 0.85rem;
            color: #64748b;
            margin: 6px 0 16px 0;
        }

        [data-theme="dark"] .desc {
            color: #94a3b8;
        }

        .crew-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .crew-row {
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.2fr 1.2fr auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .crew-row.is-locked {
            background-color: var(--locked-bg);
        }

        @media (max-width: 680px) {
            .crew-row {
                grid-template-columns: 1fr 1fr;
            }
            .crew-row .action-col {
                grid-column: span 2;
                display: flex;
                justify-content: flex-end;
            }
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
            opacity: 0.8;
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text);
        }

        input:disabled {
            opacity: 0.95;
            cursor: not-allowed;
            font-weight: bold;
            color: var(--accent);
            background-color: var(--locked-bg);
        }

        input:focus, select:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .badge-base { background: #dbeafe; color: #1e40af; }
        .badge-ahead { background: #dcfce7; color: #166534; }
        .badge-behind { background: #fee2e2; color: #991b1b; }

        [data-theme="dark"] .badge-base { background: #1e3a8a; color: #93c5fd; }
        [data-theme="dark"] .badge-ahead { background: #14532d; color: #86efac; }
        [data-theme="dark"] .badge-behind { background: #7f1d1d; color: #fca5a5; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .btn-theme {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-theme:hover {
            border-color: var(--accent);
        }

        .btn-lock {
            padding: 8px 12px;
            font-size: 0.85rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-lock.locked {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-lock.unlocked {
            background: #0284c7;
            color: white;
        }

        [data-theme="dark"] .btn-lock.locked {
            background: #334155;
            color: #cbd5e1;
        }

        .btn-anchor {
            background: #16a34a;
            color: white;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn-anchor:hover { background: #15803d; }

        .btn-add { background: var(--primary); color: white; padding: 8px 14px; font-size: 0.85rem; }
        .btn-add:hover { opacity: 0.9; }

        .btn-del { background: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-del:hover { background: #dc2626; }

        .btn-base {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .tip-box {
            background-color: rgba(2, 132, 199, 0.08);
            border-left: 4px solid var(--accent);
            padding: 10px 14px;
            font-size: 0.85rem;
            border-radius: 0 6px 6px 0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-bar">
            <h1>救護秘錄器時間自動同步器</h1>
            <button id="theme-btn" class="btn-theme" onclick="cycleTheme()">🌐 自動</button>
        </div>
        <p class="desc">填入關鍵對齊時間後儲存校正點，隨後輸入任何未上鎖鏡頭時間，上鎖欄位即自動即時換算。</p>

        <div class="tip-box">
            💡 <strong>三步操作說明：</strong><br>
            1. **設定對齊點**：將所有人設為 🔓 未上鎖，填入同一瞬間（如：接觸患者）的時間，點擊綠色 **「📌 儲存為對齊對照點」**。<br>
            2. **鎖定其他鏡頭**：將不需要手動輸入的鏡頭點擊 **🔒 上鎖**。<br>
            3. **自動換算查詢**：在任何 🔓 未上鎖的欄位輸入時間，所有 🔒 上鎖欄位就會<strong>自動即時換算為對應畫面時間</strong>！
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap;">
            <div style="display: flex; gap: 8px;">
                <button class="btn-anchor" onclick="saveAnchorPoints()">📌 儲存為對齊對照點</button>
                <button class="btn-add" onclick="addCrew()">+ 新增人員</button>
            </div>
            <span style="font-size: 0.8rem; opacity: 0.7;" id="anchor-status-text">已對齊基準時間</span>
        </div>

        <div id="crew-container" class="crew-list"></div>
    </div>
</div>

<script>
    // 預設資料（預設以 隊員 A, B, C, D 命名，並預設對齊時間）
    let crewList = [
        { id: 'c1', name: '隊員 A', time: '12:00:00', anchorTime: '12:00:00', isLocked: false, isBase: true },
        { id: 'c2', name: '隊員 B', time: '12:00:25', anchorTime: '12:00:25', isLocked: true, isBase: false },
        { id: 'c3', name: '隊員 C', time: '11:59:40', anchorTime: '11:59:40', isLocked: true, isBase: false },
        { id: 'c4', name: '隊員 D', time: '12:00:00', anchorTime: '12:00:00', isLocked: true, isBase: false }
    ];

    let themeSetting = 'auto';

    function cycleTheme() {
        if (themeSetting === 'auto') themeSetting = 'light';
        else if (themeSetting === 'light') themeSetting = 'dark';
        else themeSetting = 'auto';
        applyTheme();
    }

    function getEffectiveTheme() {
        if (themeSetting === 'auto') {
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        return themeSetting;
    }

    function applyTheme() {
        const effective = getEffectiveTheme();
        document.documentElement.setAttribute('data-theme', effective);
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) {
            if (themeSetting === 'auto') {
                themeBtn.innerHTML = `🌐 自動 (${effective === 'dark' ? '夜間' : '日間'})`;
            } else if (themeSetting === 'light') {
                themeBtn.innerHTML = '☀️ 日間模式';
            } else {
                themeBtn.innerHTML = '🌙 夜間模式';
            }
        }
    }

    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (themeSetting === 'auto') applyTheme();
        });
    }

    // 時間字串 (HH:MM:SS) 轉總秒數
    function timeToSeconds(t) { 
        if (!t || typeof t !== 'string') return 0; 
        const parts = t.split(':').map(Number); 
        if (parts.length < 2 || parts.some(isNaN)) return 0;
        return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0); 
    }

    // 總秒數轉時間字串 (HH:MM:SS 24小時制)
    function secondsToTime(s) { 
        s = (s % 86400 + 86400) % 86400; 
        const h = String(Math.floor(s / 3600)).padStart(2, '0');
        const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        const sec = String(Math.floor(s % 60)).padStart(2, '0');
        return `${h}:${m}:${sec}`; 
    }

    // 將目前的輸入時間儲存為對齊基準點 (Anchor Points)
    function saveAnchorPoints() {
        crewList.forEach(c => {
            c.anchorTime = c.time;
        });
        updateBadges();
        const statusText = document.getElementById('anchor-status-text');
        if (statusText) {
            statusText.textContent = "✅ 已更新並儲存對齊錨點";
            statusText.style.color = "#16a34a";
            setTimeout(() => {
                statusText.textContent = "已對齊基準時間";
                statusText.style.color = "";
            }, 3000);
        }
        alert("已成功設定當前所有人的時間為【對齊基準點】！\n現在您可在未上鎖欄位輸入任意時間，其他已上鎖欄位將自動連動換算。");
    }

    // 新增人員
    function addCrew() {
        const nextLetter = String.fromCharCode(65 + (crewList.length % 26));
        const defaultName = `隊員 ${nextLetter}`;
        const name = prompt("請輸入新增人員姓名或職務：", defaultName);
        if (name === null) return;
        
        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const defaultTime = baseCam ? baseCam.time : '12:00:00';

        crewList.push({
            id: 'c_' + Date.now(),
            name: name.trim() || defaultName,
            time: defaultTime,
            anchorTime: defaultTime,
            isLocked: true,
            isBase: false
        });
        render();
    }

    // 刪除人員
    function removeCrew(id) {
        if (crewList.length <= 1) return alert("至少需保留一位人員！");
        crewList = crewList.filter(c => c.id !== id);
        if (!crewList.some(c => c.isBase)) crewList[0].isBase = true;
        render();
    }

    // 設定基準人
    function setBaseCrew(id) {
        crewList.forEach(c => c.isBase = (c.id === id));
        render();
    }

    // 上鎖/解鎖開關
    function toggleLock(id) {
        const target = crewList.find(c => c.id === id);
        if (target) {
            target.isLocked = !target.isLocked;
            render();
        }
    }

    // 當使用者在「未上鎖」欄位輸入時間時，即時運算並更新所有上鎖欄位
    function handleTimeInput(sourceId, newTime) {
        if (!newTime) return;
        const source = crewList.find(c => c.id === sourceId);
        if (!source) return;

        source.time = newTime;

        const sourceAnchorSec = timeToSeconds(source.anchorTime);
        const sourceCurrentSec = timeToSeconds(source.time);
        const deltaSec = sourceCurrentSec - sourceAnchorSec; // 時間位移秒數

        crewList.forEach(target => {
            if (target.isLocked && target.id !== sourceId) {
                const targetAnchorSec = timeToSeconds(target.anchorTime);
                const targetNewSec = targetAnchorSec + deltaSec;
                target.time = secondsToTime(targetNewSec);
                
                const inputEl = document.getElementById(`time-input-${target.id}`);
                if (inputEl) {
                    inputEl.value = target.time;
                }
            }
        });

        updateBadges();
    }

    // 自訂名稱更新
    function updateCrewName(id, newName) {
        const c = crewList.find(item => item.id === id);
        if (c) c.name = newName;
    }

    // 即時更新時差標籤
    function updateBadges() {
        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const baseAnchorSec = timeToSeconds(baseCam.anchorTime);

        crewList.forEach(c => {
            const badgeEl = document.getElementById(`badge-${c.id}`);
            if (badgeEl) {
                const cAnchorSec = timeToSeconds(c.anchorTime);
                const diff = cAnchorSec - baseAnchorSec;

                let badgeHtml = '';
                if (c.isBase) {
                    badgeHtml = `<span class="badge badge-base">基準機</span>`;
                } else if (diff > 0) {
                    badgeHtml = `<span class="badge badge-ahead">快 ${diff} 秒</span>`;
                } else if (diff < 0) {
                    badgeHtml = `<span class="badge badge-behind">慢 ${Math.abs(diff)} 秒</span>`;
                } else {
                    badgeHtml = `<span class="badge badge-base">同步 (0s)</span>`;
                }
                badgeEl.innerHTML = badgeHtml;
            }
        });
    }

    // 渲染列表
    function render() {
        const container = document.getElementById('crew-container');
        container.innerHTML = '';

        const baseCam = crewList.find(c => c.isBase) || crewList[0];
        const baseAnchorSec = timeToSeconds(baseCam.anchorTime);

        crewList.forEach(c => {
            const cAnchorSec = timeToSeconds(c.anchorTime);
            const diff = cAnchorSec - baseAnchorSec;

            let badgeHtml = '';
            if (c.isBase) {
                badgeHtml = `<span class="badge badge-base">基準機</span>`;
            } else if (diff > 0) {
                badgeHtml = `<span class="badge badge-ahead">快 ${diff} 秒</span>`;
            } else if (diff < 0) {
                badgeHtml = `<span class="badge badge-behind">慢 ${Math.abs(diff)} 秒</span>`;
            } else {
                badgeHtml = `<span class="badge badge-base">同步 (0s)</span>`;
            }

            const row = document.createElement('div');
            row.className = `crew-row ${c.isLocked ? 'is-locked' : ''}`;
            row.innerHTML = `
                <div>
                    <label>人員姓名 / 職務：</label>
                    <input type="text" value="${c.name}" placeholder="如：隊員 A、主救" oninput="updateCrewName('${c.id}', this.value)">
                </div>
                <div>
                    <label>秘錄器時間 (24小時制)：</label>
                    <input type="time" step="1" lang="en-GB" id="time-input-${c.id}" value="${c.time}" 
                        ${c.isLocked ? 'disabled' : ''} 
                        oninput="handleTimeInput('${c.id}', this.value)" 
                        onchange="handleTimeInput('${c.id}', this.value)">
                </div>
                <div>
                    <label>鎖定狀態：</label>
                    <button class="btn-lock ${c.isLocked ? 'locked' : 'unlocked'}" onclick="toggleLock('${c.id}')">
                        ${c.isLocked ? '🔒 已上鎖 (自動換算)' : '🔓 未上鎖 (輸入中)'}
                    </button>
                </div>
                <div>
                    <label>時差關係：</label>
                    <div id="badge-${c.id}">${badgeHtml}</div>
                </div>
                <div class="action-col" style="margin-top: 14px;">
                    ${!c.isBase ? `<button onclick="setBaseCrew('${c.id}')" class="btn-base">設為基準</button>` : ''}
                    ${!c.isBase ? `<button class="btn-del" onclick="removeCrew('${c.id}')" style="margin-left: 6px;">刪除</button>` : ''}
                </div>
            `;
            container.appendChild(row);
        });

        updateBadges();
    }

    window.onload = () => {
        applyTheme();
        render();
    };
</script>

</body>
</html>
